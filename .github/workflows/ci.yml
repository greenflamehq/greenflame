name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel an in-progress run for the same ref when a new push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Build & Test matrix: MSVC Debug/Release + Clang-cl Debug/Release
  # ---------------------------------------------------------------------------
  build:
    name: Build & Test (${{ matrix.preset }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset:
          - x64-debug
          - x64-release
          - x64-debug-clang
          - x64-release-clang

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and test
        shell: cmd
        run: |
          call scripts\gha-vs-dev-cmd.cmd
          if errorlevel 1 exit /b 1
          cmake --preset ${{ matrix.preset }}
          if errorlevel 1 exit /b 1
          cmake --build --preset ${{ matrix.preset }}
          if errorlevel 1 exit /b 1
          ctest --test-dir build/${{ matrix.preset }} --output-on-failure
          if errorlevel 1 exit /b 1

  # ---------------------------------------------------------------------------
  # clang-format: fail if any source file is not already correctly formatted.
  # No reformatting is performed; the working tree is left untouched.
  # ---------------------------------------------------------------------------
  clang-format:
    name: clang-format
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check formatting
        shell: bash
        run: |
          find src tests \( -name "*.cpp" -o -name "*.h" \) -print0 \
            | xargs -0 clang-format --dry-run --Werror
